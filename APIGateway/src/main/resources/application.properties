
spring.application.name=api-gateway
server.port=8000

# Patient Service Route
spring.cloud.gateway.server.webmvc.routes[0].id=patient-service
spring.cloud.gateway.server.webmvc.routes[0].uri=http://localhost:8081
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/patient

# Doctor Service Route
spring.cloud.gateway.server.webmvc.routes[1].id=doctor-service
spring.cloud.gateway.server.webmvc.routes[1].uri=http://localhost:8082
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/doctor
